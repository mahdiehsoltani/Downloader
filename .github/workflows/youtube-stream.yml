      - name: 🚀 Push to Temp Branch & Promote
        run: |
          set -euo pipefail
          TEMP_BRANCH="youtube-stream-tmp-${{ github.run_id }}"
          REAL_BRANCH="youtube-stream"
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          ORPHAN_DIR=$(mktemp -d)
          if [[ "${{ github.event.inputs.type }}" == 'video' ]]; then
            cp /tmp/hls/*.ts "$ORPHAN_DIR/" 2>/dev/null || true
            cp /tmp/hls/*.m3u8 "$ORPHAN_DIR/" 2>/dev/null || true
            cp /tmp/subtitles.vtt "$ORPHAN_DIR/" 2>/dev/null || true
            cp /tmp/player.html "$ORPHAN_DIR/"
          else
            cp /tmp/audio/audio.mp3 "$ORPHAN_DIR/"
            cp /tmp/audio-player.html "$ORPHAN_DIR/"
          fi

          cd "$ORPHAN_DIR"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin "$REPO_URL"

          mapfile -t FILES < <(ls -1)
          TOTAL=${#FILES[@]}
          BATCH_SIZE=50
          FIRST=0
          COMMIT_COUNT=0

          while [ $FIRST -lt $TOTAL ]; do
            BATCH=("${FILES[@]:$FIRST:$BATCH_SIZE}")
            git add -- "${BATCH[@]}"
            git commit -m "chore: stream part $((COMMIT_COUNT+1)) [skip ci]" || { echo "ℹ️ Empty batch"; break; }
            COMMIT_COUNT=$((COMMIT_COUNT+1))
            echo "🚀 Pushing batch $COMMIT_COUNT (${#BATCH[@]} files)"
            for attempt in 1 2 3; do
              if [ $COMMIT_COUNT -eq 1 ]; then
                git push origin "HEAD:$TEMP_BRANCH" --force && break
              else
                git push origin "HEAD:$TEMP_BRANCH" && break
              fi
              echo "⚠️ Push attempt $attempt failed, retrying..."
              sleep 5
            done
            FIRST=$((FIRST + BATCH_SIZE))
          done

          echo "🔀 Promoting $TEMP_BRANCH → $REAL_BRANCH"
          git push origin "+HEAD:refs/heads/$REAL_BRANCH"
          git push origin --delete "$TEMP_BRANCH"
          echo "✅ Branch $REAL_BRANCH updated, temp branch deleted"

      - name: 📋 Summary
        run: |
          REPO="${{ github.repository }}"
          USER=$(echo "$REPO" | cut -d'/' -f1)
          REPO_NAME=$(echo "$REPO" | cut -d'/' -f2)
          if [[ "${{ github.event.inputs.type }}" == 'video' ]]; then
            echo "🎬 Player page: https://raw.githubusercontent.com/${REPO}/refs/heads/youtube-stream/player.html"
            echo "📥 Download & open the HTML file locally to watch, or use a tool like VLC to open the raw playlist:"
            echo "   https://raw.githubusercontent.com/${REPO}/refs/heads/youtube-stream/playlist.m3u8"
          else
            echo "🎵 Audio page: https://raw.githubusercontent.com/${REPO}/refs/heads/youtube-stream/audio-player.html"
          fi
