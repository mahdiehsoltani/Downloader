name: 🐋 Whisper Model Downloader

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🔧 Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zip
          pip install requests

      # ─── STEP 1: Fetch all official model URLs (GitHub API) ───
      - name: 🔗 Fetch model URLs from GitHub Discussion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python << 'EOF'
          import requests, re, os

          headers = {"Accept": "application/vnd.github+json"}
          if os.environ.get("GH_TOKEN"):
              headers["Authorization"] = f"Bearer {os.environ['GH_TOKEN']}"

          disc_url = "https://api.github.com/repos/openai/whisper/discussions/2"
          r = requests.get(disc_url, headers=headers)
          r.raise_for_status()
          bodies = [r.json()["body"]]

          comments_url = "https://api.github.com/repos/openai/whisper/discussions/2/comments"
          page = 1
          while True:
              params = {"page": page, "per_page": 100}
              rc = requests.get(comments_url, headers=headers, params=params)
              rc.raise_for_status()
              comments = rc.json()
              if not comments:
                  break
              for c in comments:
                  bodies.append(c["body"])
              page += 1

          pattern = r'\[.*?\]\((https://openaipublic\.azureedge\.net/main/whisper/models/[a-f0-9]+/[^)]+\.pt)\)'
          links = set()
          for body in bodies:
              links.update(re.findall(pattern, body, re.IGNORECASE))

          with open("whisper_models.txt", "w") as f:
              for link in sorted(links):
                  f.write(link + "\n")
          print(f"Found {len(links)} model URLs")
          EOF

      # ─── STEP 2: Download & split every model ───
      - name: ⬇️ Download and process models
        run: |
          python << 'EOF'
          import requests, os, subprocess, time
          from urllib.parse import urlparse

          SPLIT_MB = 90

          def download(url, dest, retries=3):
              fname = os.path.basename(dest)
              for i in range(retries):
                  try:
                      print(f"Downloading {fname} (attempt {i+1})…")
                      with requests.get(url, stream=True, timeout=300) as r:
                          r.raise_for_status()
                          with open(dest, 'wb') as f:
                              for chunk in r.iter_content(8192):
                                  if chunk:
                                      f.write(chunk)
                      if os.path.getsize(dest) < 1024*1024:
                          raise ValueError("Too small")
                      return os.path.getsize(dest)
                  except Exception as e:
                      print(f"Attempt {i+1} failed: {e}")
                      if i == retries-1:
                          raise
                      time.sleep(10)

          os.makedirs("./downloads", exist_ok=True)

          with open("whisper_models.txt") as f:
              urls = [line.strip() for line in f if line.strip()]

          if not urls:
              print("No URLs found")
              exit(0)

          for url in urls:
              fname = urlparse(url).path.split("/")[-1]
              if not fname.lower().endswith(".pt"):
                  continue
              print(f"\n── {fname} ──")
              tmp = f"/tmp/{fname}"
              size = download(url, tmp)
              size_mb = size / 1048576.0
              if size_mb > SPLIT_MB:
                  print(f"Splitting {size_mb:.1f} MB…")
                  subprocess.run(["zip", "-r", "-s", f"{SPLIT_MB}m",
                                 f"./downloads/{fname}.zip", tmp], check=True)
                  os.remove(tmp)
              else:
                  os.rename(tmp, f"./downloads/{fname}")
          print("\nDone\n")
          EOF

      # ─── STEP 3: Push to downloads branch ───
      - name: 📤 Commit & Push to downloads branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ./downloads/
          if git diff --staged --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "chore: add whisper models [skip ci]"
          for i in 1 2 3; do
            git push origin HEAD:downloads --force && exit 0
            sleep 15
          done
          exit 1

      # ─── STEP 4: Zip & upload artifact ───
      - name: 📦 Compress and upload artifact
        run: |
          zip -r whisper-models.zip ./downloads/
          rm -rf ./downloads/
      - uses: actions/upload-artifact@v4
        with:
          name: whisper-models-${{ github.run_id }}
          path: whisper-models.zip
          retention-days: 90
