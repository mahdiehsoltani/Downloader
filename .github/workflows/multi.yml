name: 🔎 Search Academic Torrents (RSS → Branch)

on:
  workflow_dispatch:
    inputs:
      query:
        description: '🔍 Search term (matches in title)'
        required: true
        type: string
      limit:
        description: '📊 Max results to show'
        required: false
        type: number
        default: 300
      match_name_only:
        description: '📛 Match only torrent name'
        required: false
        type: boolean
        default: true
      max_pages:
        description: '📄 Max pages per paginated source'
        required: false
        type: number
        default: 5
      min_size_mb:
        description: '📏 Minimum torrent size (MB) — 0 = no filter'
        required: false
        type: number
        default: 0
      max_size_mb:
        description: '📏 Maximum torrent size (MB) — 0 = no filter'
        required: false
        type: number
        default: 0
      exclude_extensions:
        description: '🚫 Exclude file extensions (comma separated, e.g., txt,nfo,srt)'
        required: false
        type: string
        default: ''
      debug:
        description: '🐛 Enable debug logging'
        required: false
        type: boolean
        default: false

jobs:
  search-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 💾 Restore cached pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('.github/workflows/search.yml') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: 📦 Install dependencies
        run: pip install feedparser requests beautifulsoup4 snowfl scrapy

      - name: 🔧 Decode Python script
        run: |
          ENCODED=""
          echo "$ENCODED" | base64 -d > multi_search.py
          chmod +x multi_search.py

      - name: 🔎 Multi‑source search & build results
        run: python3 multi_search.py
        env:
          QUERY: ${{ github.event.inputs.query }}
          LIMIT: ${{ github.event.inputs.limit }}
          MATCH_NAME_ONLY: ${{ github.event.inputs.match_name_only }}
          MAX_PAGES: ${{ github.event.inputs.max_pages }}
          MIN_SIZE_MB: ${{ github.event.inputs.min_size_mb }}
          MAX_SIZE_MB: ${{ github.event.inputs.max_size_mb }}
          EXCLUDE_EXTENSIONS: ${{ github.event.inputs.exclude_extensions }}
          DEBUG: ${{ github.event.inputs.debug }}
          PROWLARR_TORZNAB_URL: ${{ secrets.PROWLARR_TORZNAB_URL }}
          JACKETT_TORZNAB_URL: ${{ secrets.JACKETT_TORZNAB_URL }}
          BITMAGNET_TORZNAB_URL: ${{ secrets.BITMAGNET_TORZNAB_URL }}

      - name: 🚀 Force‑push results to orphan 'torrents' branch
        run: |
          set -euxo pipefail
          BRANCH="torrents"
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          ORPHAN_DIR=$(mktemp -d)
          cp results.txt "$ORPHAN_DIR/"
          if [ -f database.xml ]; then cp database.xml "$ORPHAN_DIR/"; fi

          cd "$ORPHAN_DIR"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin "$REPO_URL"

          git add .
          git commit -m "chore: update torrent search results [skip ci]" || {
            echo "ℹ️ Nothing to commit"
            exit 0
          }

          for attempt in 1 2 3; do
            echo "🚀 Force‑push attempt $attempt to $BRANCH branch..."
            if git push origin "HEAD:$BRANCH" --force; then
              echo "✅ Push succeeded"
              exit 0
            fi
            echo "⚠️ Push failed, waiting 15 seconds..."
            sleep 15
          done
          echo "❌ Push failed after 3 attempts"
          exit 1

      - name: 📤 Upload artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: torrent-search-results
          path: results.txt
          retention-days: 7
