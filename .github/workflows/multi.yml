name: 🔎 Search Academic Torrents (RSS → Branch)

on:
  workflow_dispatch:
    inputs:
      query:
        description: '🔍 Search term (matches in title)'
        required: true
        type: string
      limit:
        description: '📊 Max results to show'
        required: false
        type: number
        default: 20
      match_name_only:
        description: '📛 Match only torrent name (otherwise also description)'
        required: false
        type: boolean
        default: true
      debug:
        description: '🐛 Enable debug logging of feed responses'
        required: false
        type: boolean
        default: false

jobs:
  search-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: pip install feedparser requests beautifulsoup4 snowfl

      - name: 🔧 Decode Python script
        run: |
          # Replace the placeholder with your base64‑encoded multi_search.py
          ENCODED=""
          echo "$ENCODED" | base64 -d > multi_search.py
          chmod +x multi_search.py

      - name: 🔎 Multi‑source search & build results
        run: python3 multi_search.py
        env:
          QUERY: ${{ github.event.inputs.query }}
          LIMIT: ${{ github.event.inputs.limit }}
          MATCH_NAME_ONLY: ${{ github.event.inputs.match_name_only }}
          DEBUG: ${{ github.event.inputs.debug }}

      - name: 🚀 Force‑push results to orphan 'torrents' branch
        run: |
          set -euxo pipefail
          BRANCH="torrents"
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          ORPHAN_DIR=$(mktemp -d)
          cp results.txt "$ORPHAN_DIR/"
          if [ -f database.xml ]; then cp database.xml "$ORPHAN_DIR/"; fi

          cd "$ORPHAN_DIR"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin "$REPO_URL"

          git add .
          git commit -m "chore: update torrent search results [skip ci]" || {
            echo "ℹ️ Nothing to commit"
            exit 0
          }

          for attempt in 1 2 3; do
            echo "🚀 Force‑push attempt $attempt to $BRANCH branch..."
            if git push origin "HEAD:$BRANCH" --force; then
              echo "✅ Push succeeded"
              exit 0
            fi
            echo "⚠️ Push failed, waiting 15 seconds..."
            sleep 15
          done
          echo "❌ Push failed after 3 attempts"
          exit 1

      - name: 📤 Upload artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: torrent-search-results
          path: results.txt
          retention-days: 7
