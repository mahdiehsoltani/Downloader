name: 📥 Torrent Downloader (qBittorrent)

on:
  workflow_dispatch:
    inputs:
      torrent_link:
        description: '🧲 Magnet link or .torrent URL'
        required: true
        type: string
      split_threshold_mb:
        description: '📦 Split files larger than (MB) — 0 = never'
        required: false
        type: number
        default: 90
      upload_to_gofile:
        description: '☁️ Also upload to gofile.io?'
        required: false
        type: boolean
        default: false

jobs:
  download-and-deliver:
    name: 🚀 Torrent Download & Deliver (qBittorrent)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: 🔧 Install Dependencies (with retry)
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            echo "🔄 apt-get attempt $i..."
            sudo apt-get update && sudo apt-get install -y qbittorrent-nox curl jq zip python3-pip && break || sleep 10
          done

      - name: 🐍 Install Python API library
        run: pip install requests

      - name: ⚙️ Prepare qBittorrent configuration
        run: |
          set -euo pipefail
          QBT_PROFILE="/tmp/qbt-profile"
          mkdir -p "$QBT_PROFILE/qBittorrent"

          # Create config that allows localhost without password
          cat > "$QBT_PROFILE/qBittorrent/qBittorrent.conf" << 'EOF'
          [Preferences]
          WebUI\Address=*
          WebUI\Port=8080
          WebUI\UseUPnP=false
          WebUI\LocalHostAuth=true
          WebUI\AuthSubnetWhitelist=127.0.0.1/32
          WebUI\AuthSubnetWhitelistEnabled=true
          Download\SavePath=/home/runner/downloads
          Download\TempPath=/home/runner/downloads/tmp
          Connection\PortRangeMin=6881
          Session\AddExtensionToIncompleteFiles=false
          Session\DisableAutoCheckDownloaded=false
          Session\Preallocation=true
          EOF

          # Start headless qbittorrent
          echo "🟢 Starting qBittorrent..."
          qbittorrent-nox --profile="$QBT_PROFILE" --webui-port=8080 &
          QBT_PID=$!
          echo "QBT_PID=$QBT_PID" >> $GITHUB_ENV

          # Wait for Web UI to be available
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8080/api/v2/app/version >/dev/null; then
              echo "✅ qBittorrent Web UI ready"
              break
            fi
            sleep 2
          done

      - name: 🧲 Add Torrent / Magnet
        run: |
          TOKEN="http://127.0.0.1:8080/api/v2"
          TORRENT_LINK="${{ github.event.inputs.torrent_link }}"

          # Add as URL (magnet or .torrent URL)
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "$TOKEN/torrents/add" \
            --data-urlencode "urls=$TORRENT_LINK" \
            --data "savepath=/home/runner/downloads")

          if [ "$STATUS" != "200" ]; then
            echo "❌ Failed to add torrent (HTTP $STATUS)"
            exit 1
          fi
          echo "✅ Torrent added"

      - name: ⏳ Monitor Download Progress
        id: monitor
        run: |
          import time, sys, requests

          API = "http://127.0.0.1:8080/api/v2"
          TIMEOUT = 6600  # 110 minutes
          STALL_LIMIT = 10  # 10 consecutive checks without progress
          CHECK_INTERVAL = 60

          start_time = time.time()
          last_size = 0
          stall_count = 0

          print("⏳ Monitoring download...")
          while True:
              time.sleep(CHECK_INTERVAL)
              try:
                  resp = requests.get(f"{API}/torrents/info", timeout=10)
                  if resp.status_code != 200:
                      print(f"⚠️ API error {resp.status_code}")
                      continue
                  torrents = resp.json()
                  if not torrents:
                      print("⚠️ No torrents found – may have been removed")
                      sys.exit(1)

                  t = torrents[0]  # we only added one
                  state = t.get("state", "")
                  progress = t.get("progress", 0.0)
                  amount_left = t.get("amount_left", -1)
                  size = t.get("size", 0)
                  name = t.get("name", "unknown")

                  print(f"   {name}: {progress*100:.1f}% | state: {state} | {amount_left} bytes left")

                  # Check for completion
                  if state in ("uploading", "stalledUP", "pausedUP", "forcedUP"):
                      if amount_left == 0:
                          print("✅ Download complete!")
                          break

                  # Error states
                  if state in ("error", "missingFiles"):
                      print(f"❌ Torrent in error state: {state}")
                      sys.exit(1)

                  # Progress detection
                  if amount_left == last_size:
                      stall_count += 1
                      if stall_count >= STALL_LIMIT:
                          print(f"❌ Download stalled for {STALL_LIMIT * CHECK_INTERVAL // 60} minutes – aborting")
                          sys.exit(1)
                  else:
                      stall_count = 0
                      last_size = amount_left

                  # Total timeout
                  if time.time() - start_time > TIMEOUT:
                      print("⏰ Total time limit reached")
                      sys.exit(1)

              except requests.ConnectionError:
                  print("⚠️ Connection lost to qBittorrent")
                  sys.exit(1)
        shell: python3

      - name: 🛑 Stop qBittorrent
        if: always()
        run: |
          kill $QBT_PID 2>/dev/null || true

      - name: 📦 Package & Split
        id: package
        run: |
          set -euo pipefail
          mkdir -p deliver

          # Zip everything with max compression
          ZIP_FILE="torrent_content.zip"
          cd /home/runner/downloads
          zip -r9 "../../deliver/$ZIP_FILE" . >/dev/null 2>&1 || true
          cd -
          rm -rf /home/runner/downloads   # free disk space

          ZIP_SIZE=$(stat -c%s "deliver/$ZIP_FILE")
          ZIP_SIZE_MB=$((ZIP_SIZE / 1048576))
          echo "📦 Zip size: ${ZIP_SIZE_MB} MB"

          THRESHOLD_MB=${{ github.event.inputs.split_threshold_mb }}
          HARD_LIMIT_MB=90

          if [[ $ZIP_SIZE_MB -gt $HARD_LIMIT_MB || ($THRESHOLD_MB -gt 0 && $ZIP_SIZE_MB -gt $THRESHOLD_MB) ]]; then
              SPLIT=$HARD_LIMIT_MB
              if [[ $THRESHOLD_MB -gt 0 && $THRESHOLD_MB -lt $HARD_LIMIT_MB ]]; then
                  SPLIT=$THRESHOLD_MB
              fi
              cd deliver
              zip -r -s "${SPLIT}m" "${ZIP_FILE}" "${ZIP_FILE}" >/dev/null 2>&1
              rm -f "$ZIP_FILE"
              cd ..
              echo "✂️ Split into parts of ${SPLIT} MB"
          else
              echo "📁 No split needed"
          fi

          echo "📂 Final delivery contents:"
          ls -lh deliver/

      - name: 🚀 Force-Push to Orphan 'torrent-downloads' Branch
        run: |
          set -euo pipefail
          BRANCH="torrent-downloads"
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          ORPHAN_DIR=$(mktemp -d)
          cp -a deliver/* "$ORPHAN_DIR/"

          cd "$ORPHAN_DIR"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin "$REPO_URL"
          git add .
          git commit -m "chore: torrent download [skip ci]" || {
            echo "ℹ️ Nothing to commit"
            exit 0
          }

          for attempt in 1 2 3; do
            echo "🚀 Force-push attempt $attempt to $BRANCH..."
            if git push origin "HEAD:$BRANCH" --force; then
              echo "✅ Push succeeded"
              exit 0
            fi
            echo "⚠️ Push failed, waiting 15s..."
            sleep 15
          done
          echo "❌ Push failed after 3 attempts"
          exit 1

      - name: 📤 Upload Artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: torrent-download-${{ github.run_id }}
          path: deliver/*
          retention-days: 90

      - name: ☁️ Upload to Gofile (optional)
        if: ${{ github.event.inputs.upload_to_gofile == 'true' }}
        run: |
          set -euo pipefail
          FILE=$(ls deliver/* 2>/dev/null | head -1)
          if [ -z "$FILE" ]; then
            echo "⚠️ No file to upload"
            exit 0
          fi
          echo "🌐 Getting gofile server..."
          SERVER=$(curl -s https://api.gofile.io/getServer | jq -r '.data.server')
          echo "📤 Uploading to $SERVER..."
          RESPONSE=$(curl -s -F "file=@$FILE" "https://${SERVER}.gofile.io/uploadFile")
          if echo "$RESPONSE" | jq -e '.status == "ok"' >/dev/null; then
            DOWNLOAD_PAGE=$(echo "$RESPONSE" | jq -r '.data.downloadPage')
            echo "✅ Gofile link: $DOWNLOAD_PAGE"
            echo "gofile_link=$DOWNLOAD_PAGE" >> $GITHUB_OUTPUT
          else
            echo "❌ Gofile upload failed:"
            echo "$RESPONSE"
          fi

      - name: 📋 Summary
        run: |
          echo "📦 Torrent download delivered to branch 'torrent-downloads'"
          echo "🌐 Permanent zip: https://github.com/${{ github.repository }}/archive/refs/heads/torrent-downloads.zip"
          echo "📋 Artifact available in this run's 'Artifacts' section (90 days)"
          if [[ -n "${{ steps.package.outputs.gofile_link }}" ]]; then
            echo "☁️ Gofile link: ${{ steps.package.outputs.gofile_link }}"
          fi
