name: 📥 Torrent Downloader (qBittorrent)

on:
  workflow_dispatch:
    inputs:
      torrent_link:
        description: '🧲 Magnet link or .torrent URL'
        required: true
        type: string
      split_threshold_mb:
        description: '📦 Split files larger than (MB) — 0 = never (max 90)'
        required: false
        type: number
        default: 90
      upload_to_gofile:
        description: '☁️ Also upload to gofile.io?'
        required: false
        type: boolean
        default: false

jobs:
  download-and-deliver:
    name: 🚀 Torrent Download & Deliver (qBittorrent)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: 🧹 Cleanup stale temporary branches
        run: |
          set -euo pipefail
          git push origin --delete "torrent-downloads-tmp-${{ github.run_id }}" 2>/dev/null || true

      - name: 🔧 Install System Dependencies (with retry)
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            echo "🔄 apt-get attempt $i..."
            sudo apt-get update && sudo apt-get install -y qbittorrent-nox curl jq zip python3-pip && break || sleep 10
          done

      - name: 💾 Restore cached pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('.github/workflows/torrent-downloader.yml') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: 🐍 Install Python API library
        run: pip install requests

      - name: ⏳ Restore previous download state (resume)
        id: resume
        uses: actions/cache@v4
        with:
          path: |
            /tmp/qbt-profile
            /home/runner/downloads
          key: torrent-resume-${{ github.run_id }}
          restore-keys: |
            torrent-resume-

      - name: 🧲 Magnet validation & early disk check
        run: |
          set -euo pipefail
          CURRENT_MAGNET="${{ github.event.inputs.torrent_link }}"

          if [ -f /tmp/qbt-profile/magnet.txt ]; then
            CACHED_MAGNET=$(cat /tmp/qbt-profile/magnet.txt)
            if [ "$CACHED_MAGNET" != "$CURRENT_MAGNET" ]; then
              echo "⚠️ Magnet mismatch – discarding cached data"
              rm -rf /home/runner/downloads /tmp/qbt-profile
            else
              echo "✅ Magnet matches – will resume previous download"
            fi
          fi

          FREE_MB=$(df /home/runner --output=avail | tail -1 | awk '{print int($1/1024)}')
          if [ $FREE_MB -lt 3072 ]; then
            echo "⚠️ Low disk space ($FREE_MB MB) – discarding cached data"
            rm -rf /home/runner/downloads /tmp/qbt-profile
          fi

      - name: ⚙️ Start qBittorrent & capture temporary password
        id: start_qbt
        run: |
          set -euo pipefail
          QBT_PROFILE="/tmp/qbt-profile"
          mkdir -p "$QBT_PROFILE/qBittorrent"

          if [ ! -f "$QBT_PROFILE/qBittorrent/qBittorrent.conf" ]; then
            cat > "$QBT_PROFILE/qBittorrent/qBittorrent.conf" << 'EOF'
          [Preferences]
          WebUI\Address=*
          WebUI\Port=8080
          WebUI\UseUPnP=false
          WebUI\LocalHostAuth=true
          WebUI\AuthSubnetWhitelist=127.0.0.1/32
          WebUI\AuthSubnetWhitelistEnabled=true
          Downloads\SavePath=/home/runner/downloads
          Downloads\TempPath=/home/runner/downloads/tmp
          Connection\PortRangeMin=6881
          Session\AddExtensionToIncompleteFiles=false
          Session\DisableAutoCheckDownloaded=false
          Session\Preallocation=true
          EOF
          fi

          echo "🟢 Starting qBittorrent..."
          qbittorrent-nox --profile="$QBT_PROFILE" --webui-port=8080 2>&1 > /tmp/qbt.log &
          QBT_PID=$!
          echo "qbt_pid=$QBT_PID" >> $GITHUB_OUTPUT

          for i in {1..30}; do
            if curl -s http://127.0.0.1:8080/api/v2/app/version >/dev/null 2>&1; then
              echo "✅ qBittorrent Web UI ready"
              break
            fi
            sleep 2
          done

          PASSWORD=$(grep -oP 'temporary password is provided for this session: \K\S+' /tmp/qbt.log || echo "")
          if [ -z "$PASSWORD" ]; then
            echo "❌ Could not find temporary password in qBittorrent log"
            exit 1
          fi
          echo "::add-mask::$PASSWORD"
          echo "qbt_password=$PASSWORD" >> $GITHUB_OUTPUT

      - name: 🧲 Add Torrent & Monitor Download (Python session)
        id: monitor
        shell: python
        env:
          QBT_PID: ${{ steps.start_qbt.outputs.qbt_pid }}
          QBT_PASSWORD: ${{ steps.start_qbt.outputs.qbt_password }}
          PYTHONUNBUFFERED: 1
        run: |
          import time, sys, requests, os

          PASSWORD = os.environ['QBT_PASSWORD']
          MAGNET = '''${{ github.event.inputs.torrent_link }}'''
          API = "http://127.0.0.1:8080/api/v2"

          session = requests.Session()
          r = session.post(f"{API}/auth/login", data={"username": "admin", "password": PASSWORD})
          if r.status_code != 200:
              print("❌ Login failed", r.status_code)
              sys.exit(1)
          print("✅ Logged in")

          r = session.post(f"{API}/torrents/add", data={"urls": MAGNET, "savepath": "/home/runner/downloads"})
          if r.status_code != 200:
              print("❌ Failed to add torrent", r.status_code)
              sys.exit(1)
          print("✅ Torrent added")

          with open('/tmp/qbt-profile/magnet.txt', 'w') as f:
              f.write(MAGNET)

          TIMEOUT = 360*60 - 600
          STALL_LIMIT = 10
          CHECK_INTERVAL = 60
          start_time = time.time()
          last_left = -1
          stall_count = 0

          print("⏳ Monitoring download...", flush=True)
          while True:
              try:
                  resp = session.get(f"{API}/torrents/info", timeout=10)
                  if resp.status_code != 200:
                      print(f"⚠️ API error {resp.status_code}", flush=True)
                      time.sleep(CHECK_INTERVAL)
                      continue
                  torrents = resp.json()
                  if not torrents:
                      print("⚠️ No torrents found", flush=True)
                      sys.exit(1)

                  t = torrents[0]
                  state = t.get("state", "")
                  progress = t.get("progress", 0.0)
                  amount_left = t.get("amount_left", -1)
                  name = t.get("name", "unknown")
                  print(f"   {name}: {progress*100:.1f}% | state: {state} | {amount_left} bytes left", flush=True)

                  if state in ("uploading", "stalledUP", "pausedUP", "forcedUP") and amount_left == 0:
                      print("✅ Download complete!", flush=True)
                      time.sleep(5)
                      break

                  if state in ("error", "missingFiles"):
                      print(f"❌ Torrent in error state: {state}", flush=True)
                      sys.exit(1)

                  if amount_left == last_left:
                      stall_count += 1
                      if stall_count >= STALL_LIMIT:
                          print(f"❌ Stalled for {STALL_LIMIT * CHECK_INTERVAL // 60} min", flush=True)
                          sys.exit(1)
                  else:
                      stall_count = 0
                      last_left = amount_left

                  if time.time() - start_time > TIMEOUT:
                      print("⏰ Timeout – will attempt to save state for next run", flush=True)
                      with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                          f.write('timeout=true\n')
                      sys.exit(0)

              except requests.ConnectionError:
                  print("⚠️ Connection lost", flush=True)
                  sys.exit(1)

              time.sleep(CHECK_INTERVAL)

      - name: 🛑 Stop qBittorrent
        if: always()
        run: |
          kill ${{ steps.start_qbt.outputs.qbt_pid }} 2>/dev/null || true

      - name: 💾 Save download state for future resume (on timeout/failure)
        if: failure() || cancelled() || steps.monitor.outputs.timeout == 'true'
        run: |
          set -euo pipefail
          DL_DIR="/home/runner/downloads"
          if [ ! -d "$DL_DIR" ] || [ -z "$(ls -A "$DL_DIR" 2>/dev/null)" ]; then
            echo "No data to cache"
            exit 0
          fi
          CONTENT_SIZE=$(du -sb "$DL_DIR" | cut -f1)
          CONTENT_MB=$((CONTENT_SIZE / 1048576))
          MAX_CACHE_MB=8000
          if [ $CONTENT_MB -gt $MAX_CACHE_MB ]; then
            echo "⚠️ Data too large for cache ($CONTENT_MB MB) – skipping state save"
            exit 0
          fi
          echo "Caching download state (${CONTENT_MB} MB) for next run..."
          echo "state_saved=true" >> $GITHUB_OUTPUT
        id: save_state_flag

      - name: 📦 Save cache (state)
        if: steps.save_state_flag.outputs.state_saved == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            /tmp/qbt-profile
            /home/runner/downloads
          key: torrent-resume-${{ github.run_id }}

      - name: 📊 Check if download completed before packaging
        run: |
          if [ ! -d /home/runner/downloads ] || [ -z "$(ls -A /home/runner/downloads 2>/dev/null)" ]; then
            echo "❌ No download data – did the torrent fail or timeout? Exiting."
            exit 1
          fi

      - name: 💽 Disk space check & prepare download folder
        run: |
          set -euo pipefail
          DL_DIR="/home/runner/downloads"
          CONTENT_SIZE=$(du -sb "$DL_DIR" | cut -f1)
          AVAILABLE_KB=$(df /home/runner | awk 'NR==2 {print $4}')
          AVAILABLE_BYTES=$((AVAILABLE_KB * 1024))
          if [ "$AVAILABLE_BYTES" -lt $((CONTENT_SIZE * 2)) ]; then
            echo "❌ Not enough free disk space. Content: $((CONTENT_SIZE/1048576)) MB, free: $((AVAILABLE_BYTES/1048576)) MB"
            exit 1
          fi
          echo "✅ Disk space OK (content: $((CONTENT_SIZE/1048576)) MB, free: $((AVAILABLE_BYTES/1048576)) MB)"

      - name: 📦 Package directly into split zip
        id: package
        run: |
          set -euo pipefail
          DL_DIR="/home/runner/downloads"
          DELIVER_DIR="./deliver"
          mkdir -p "$DELIVER_DIR"

          THRESHOLD_MB=${{ github.event.inputs.split_threshold_mb }}
          HARD_LIMIT_MB=90
          if [ "$THRESHOLD_MB" -gt 0 ] 2>/dev/null && [ "$THRESHOLD_MB" -le "$HARD_LIMIT_MB" ]; then
            SPLIT_MB=$THRESHOLD_MB
          else
            SPLIT_MB=$HARD_LIMIT_MB
          fi

          echo "✂️ Creating split zip with part size ${SPLIT_MB} MB"
          cd "$DL_DIR"
          zip -r -s "${SPLIT_MB}m" "${OLDPWD}/${DELIVER_DIR}/torrent_content.zip" . >/dev/null 2>&1
          cd -

          rm -rf "$DL_DIR"
          echo "✅ Zipped and cleaned up"

          echo "📂 Final delivery contents:"
          ls -lh "$DELIVER_DIR"

      - name: 🚀 Batched Push to Temporary Branch & Promote
        run: |
          set -euo pipefail
          TEMP_BRANCH="torrent-downloads-tmp-${{ github.run_id }}"
          REAL_BRANCH="torrent-downloads"
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          DELIVER_DIR="./deliver"
          BATCH_SIZE=5

          ORPHAN_DIR=$(mktemp -d)
          cp "$DELIVER_DIR"/* "$ORPHAN_DIR/"
          cd "$ORPHAN_DIR"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin "$REPO_URL"

          mapfile -t FILES < <(ls -1)
          TOTAL=${#FILES[@]}
          FIRST=0
          COMMIT_COUNT=0

          while [ $FIRST -lt $TOTAL ]; do
            BATCH=("${FILES[@]:$FIRST:$BATCH_SIZE}")
            git add -- "${BATCH[@]}"
            COMMIT_MSG="chore: torrent download part $((COMMIT_COUNT+1)) [skip ci]"
            git commit -m "$COMMIT_MSG" || { echo "ℹ️ Nothing to commit (batch empty)"; break; }
            COMMIT_COUNT=$((COMMIT_COUNT+1))
            echo "🚀 Pushing batch $COMMIT_COUNT (${#BATCH[@]} files) to temp branch..."
            for attempt in 1 2 3; do
              if [ $COMMIT_COUNT -eq 1 ]; then
                git push origin "HEAD:$TEMP_BRANCH" --force && break
              else
                git push origin "HEAD:$TEMP_BRANCH" && break
              fi
              echo "⚠️ Push attempt $attempt failed, waiting 15s..."
              sleep 15
            done
            FIRST=$((FIRST + BATCH_SIZE))
          done

          # Promote directly from here
          echo "🔀 Promoting $TEMP_BRANCH → $REAL_BRANCH"
          git push origin "+HEAD:refs/heads/$REAL_BRANCH"
          git push origin --delete "$TEMP_BRANCH"
          echo "✅ Real branch updated, temp branch deleted"

      - name: ☁️ Upload to Gofile (optional)
        if: ${{ github.event.inputs.upload_to_gofile == 'true' }}
        run: |
          set -euo pipefail
          FILE=$(ls ./deliver/* 2>/dev/null | head -1)
          if [ -z "$FILE" ]; then
            echo "⚠️ No file to upload"
            exit 0
          fi
          echo "🌐 Getting gofile server..."
          SERVER=$(curl -s https://api.gofile.io/getServer | jq -r '.data.server')
          echo "📤 Uploading to $SERVER..."
          RESPONSE=$(curl -s -F "file=@$FILE" "https://${SERVER}.gofile.io/uploadFile")
          if echo "$RESPONSE" | jq -e '.status == "ok"' >/dev/null; then
            DOWNLOAD_PAGE=$(echo "$RESPONSE" | jq -r '.data.downloadPage')
            echo "✅ Gofile link: $DOWNLOAD_PAGE"
            echo "gofile_link=$DOWNLOAD_PAGE" >> $GITHUB_OUTPUT
          else
            echo "❌ Gofile upload failed:"
            echo "$RESPONSE"
          fi

      - name: 📋 Summary
        run: |
          echo "📦 Torrent download delivered to branch 'torrent-downloads'"
          echo "🌐 Permanent zip: https://github.com/${{ github.repository }}/archive/refs/heads/torrent-downloads.zip"
          if [[ -n "${{ steps.package.outputs.gofile_link }}" ]]; then
            echo "☁️ Gofile link: ${{ steps.package.outputs.gofile_link }}"
          fi
