name: 🔎 Torrent Search (Fixed – Base64 Scripts)

on:
  workflow_dispatch:
    inputs:
      source:
        description: '🌐 Torrent source'
        required: true
        type: choice
        options:
          - Academic Torrents (RSS dump, no live seeders)
          - BT4G (general, with seeders)
          - Nyaa (anime, with seeders)
        default: 'Academic Torrents (RSS dump, no live seeders)'
      query:
        description: '🔍 Search term'
        required: true
        type: string
      limit:
        description: '📊 Max results'
        required: false
        type: number
        default: 20
      min_seeders:
        description: '🌱 Min seeders (BT4G / Nyaa only)'
        required: false
        type: number
        default: 0

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 🛠️ Install tools
        run: |
          set -x
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl jq zip python3

      - name: 🔍 Academic Torrents search
        if: ${{ github.event.inputs.source == 'Academic Torrents (RSS dump, no live seeders)' }}
        run: |
          set -x
          mkdir -p results
          curl -v --max-time 60 -o database.xml "https://academictorrents.com/database.xml"
          echo "Script decoding..."
          # Base64-encoded Python script (generated from the original)
          echo "" | base64 -d > /tmp/search_academic.py
          python3 /tmp/search_academic.py
          cat results/academic.txt >> results/final.txt
        env:
          QUERY: ${{ github.event.inputs.query }}
          LIMIT: ${{ github.event.inputs.limit }}

      - name: 🔍 BT4G search
        if: ${{ github.event.inputs.source == 'BT4G (general, with seeders)' }}
        run: |
          set -x
          mkdir -p results
          curl -v "https://bt4g.org/rss?q=${{ github.event.inputs.query }}&sort=seeders&order=desc" \
            -H "User-Agent: Mozilla/5.0" -o results/bt4g.xml
          echo "" | base64 -d > /tmp/search_bt4g.py
          python3 /tmp/search_bt4g.py
          cat results/bt4g.txt >> results/final.txt
        env:
          QUERY: ${{ github.event.inputs.query }}
          LIMIT: ${{ github.event.inputs.limit }}
          MIN_SEED: ${{ github.event.inputs.min_seeders }}

      - name: 🔍 Nyaa search
        if: ${{ github.event.inputs.source == 'Nyaa (anime, with seeders)' }}
        run: |
          set -x
          mkdir -p results
          curl -v "https://nyaa.si/?page=rss&q=${{ github.event.inputs.query }}&c=1_0&f=0" \
            -H "User-Agent: Mozilla/5.0" -o results/nyaa.xml
          echo "" | base64 -d > /tmp/search_nyaa.py
          python3 /tmp/search_nyaa.py
          cat results/nyaa.txt >> results/final.txt
        env:
          QUERY: ${{ github.event.inputs.query }}
          LIMIT: ${{ github.event.inputs.limit }}
          MIN_SEED: ${{ github.event.inputs.min_seeders }}

      - name: 🚀 Combine & deliver results
        if: always()
        run: |
          set -x
          mkdir -p results
          # If a source didn't run, create empty placeholder
          [ -f results/academic.txt ] || echo "(no academic results)" > results/academic.txt
          [ -f results/bt4g.txt ] || echo "(no BT4G results)" > results/bt4g.txt
          [ -f results/nyaa.txt ] || echo "(no Nyaa results)" > results/nyaa.txt

          echo "===== Academic Torrents =====" > results/final.txt
          cat results/academic.txt >> results/final.txt
          echo "" >> results/final.txt
          echo "===== BT4G =====" >> results/final.txt
          cat results/bt4g.txt >> results/final.txt
          echo "" >> results/final.txt
          echo "===== Nyaa =====" >> results/final.txt
          cat results/nyaa.txt >> results/final.txt

          cat results/final.txt

      - name: 🚀 Push to orphan 'torrents' branch
        if: always()
        run: |
          set -x
          BRANCH="torrents"
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          ORPHAN_DIR=$(mktemp -d)
          cp results/final.txt "$ORPHAN_DIR/"
          cd "$ORPHAN_DIR"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin "$REPO_URL"
          git add .
          if git commit -m "chore: torrent search results [skip ci]"; then
            echo "✅ Commit created"
          else
            echo "ℹ️ Nothing to commit"
            exit 0
          fi
          for attempt in 1 2 3; do
            echo "🚀 Push attempt $attempt..."
            if git push origin "HEAD:$BRANCH" --force; then
              echo "✅ Push succeeded"
              exit 0
            fi
            sleep 15
          done
          echo "❌ Push failed after 3 attempts"
          exit 1

      - name: 📤 Upload artifact (logs & results)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-results-${{ github.run_id }}
          path: |
            results/
            database.xml
          retention-days: 7
