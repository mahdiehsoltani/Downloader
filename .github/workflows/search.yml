name: 🔎 Search Academic Torrents (Full Debug)

on:
  workflow_dispatch:
    inputs:
      query:
        description: '🔍 Search term'
        required: true
        type: string
      limit:
        description: '📊 Number of results'
        required: false
        type: number
        default: 10
      sort_by:
        description: '📈 Sort by'
        required: false
        type: choice
        options:
          - seeders
          - relevance
          - size
          - date_added
        default: 'seeders'

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: 🔧 Install Dependencies (with debug)
        shell: bash
        run: |
          set -euxo pipefail
          echo "🛠️ System info:"
          uname -a
          python3 --version
          pip3 --version || echo "pip3 not found, trying pip..."
          
          # Ubuntu 24.04 runners may require --break-system-packages
          pip3 install requests --break-system-packages 2>&1 || \
          pip3 install requests 2>&1 || \
          python3 -m pip install requests 2>&1 || {
            echo "❌ Failed to install requests"
            exit 1
          }
          python3 -c "import requests; print('Requests version:', requests.__version__)"

      - name: 🔎 Search & Capture Everything (Full Log)
        shell: bash
        run: |
          set -euxo pipefail
          echo "================== ENVIRONMENT =================="
          echo "QUERY: '${{ github.event.inputs.query }}'"
          echo "LIMIT: ${{ github.event.inputs.limit }}"
          echo "SORT_BY: ${{ github.event.inputs.sort_by }}"
          echo "HOME: $HOME"
          echo "PWD: $PWD"
          echo "================================================="

          # Simple connectivity test
          echo "🌐 Testing connectivity to api endpoint..."
          curl -v --max-time 10 "https://academictorrents.com/apiv2/entries?search=test&limit=1" \
               -H "User-Agent: Mozilla/5.0" 2>&1 | tee curl_verbose.log || {
            echo "❌ Curl failed – network or DNS issue"
            cat curl_verbose.log
            exit 1
          }

          python3 << 'PYEOF'
          import requests, json, sys, os, traceback, time

          QUERY = os.environ['QUERY']
          LIMIT = int(os.environ['LIMIT'])
          SORT = os.environ['SORT_BY']

          BASE = "https://academictorrents.com/apiv2/entries"
          params = {
              "search": QUERY,
              "limit": LIMIT,
              "sort": SORT,
              "order": "desc"
          }
          headers = {"User-Agent": "Mozilla/5.0", "Accept": "application/json"}

          print(f"🔍 Full request URL: {BASE}?search={QUERY}&limit={LIMIT}&sort={SORT}&order=desc")
          print(f"🧩 Params: {params}")
          print(f"📡 Headers: {headers}")

          try:
              r = requests.get(BASE, params=params, headers=headers, timeout=15)
              print(f"📩 Status code: {r.status_code}")
              print(f"📋 Response headers: {dict(r.headers)}")
              # Save raw response even if not JSON
              with open("raw_response.json", "w", encoding="utf-8") as f:
                  f.write(r.text)
              print(f"📄 Raw response saved (length {len(r.text)} chars)")
              print("📄 First 500 chars of response:")
              print(r.text[:500])

              r.raise_for_status()
          except Exception as e:
              print("❌ Request error:")
              traceback.print_exc()
              sys.exit(1)

          data = r.json()
          print(f"🔢 Type of JSON root: {type(data)}")
          if isinstance(data, list):
              torrents = data
              print("ℹ️ Response is a list")
          elif isinstance(data, dict):
              torrents = data.get("torrents", [])
              print(f"ℹ️ Response is dict with keys: {list(data.keys())}")
              if "error" in data:
                  print(f"⚠️ API returned error: {data['error']}")
                  sys.exit(1)
          else:
              torrents = []
              print(f"❌ Unexpected root type: {type(data)}")

          if not torrents:
              print("⚠️ No torrents found in response. Exiting gracefully (not an error).")
              sys.exit(0)

          print(f"✅ Found {len(torrents)} torrent(s)\n")
          lines = []
          for idx, t in enumerate(torrents):
              name = t.get("name", "Unknown")
              magnet = t.get("magnet", "N/A")
              size = t.get("size", "?")
              seeders = t.get("seeders", 0)
              torrent_file = t.get("torrent_file", "")
              line = (
                  f"📌 {name}\n"
                  f"   🔗 Magnet: {magnet}\n"
                  f"   📦 Size: {size}\n"
                  f"   🌱 Seeders: {seeders}\n"
                  f"   🧲 Torrent file: {torrent_file}\n"
                  f"---"
              )
              print(line)
              lines.append(line)

          with open("results.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(lines))

          print("\n✅ Parsed results saved to results.txt")
          PYEOF
        env:
          QUERY: ${{ github.event.inputs.query }}
          LIMIT: ${{ github.event.inputs.limit }}
          SORT_BY: ${{ github.event.inputs.sort_by }}

      - name: 📤 Upload debug artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-debug-logs
          path: |
            raw_response.json
            results.txt
            curl_verbose.log
          retention-days: 7

      - name: 📤 Upload parsed results (if exists)
        id: upload_parsed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: torrent-search-results
          path: results.txt
          retention-days: 7
