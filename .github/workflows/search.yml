name: 🔎 Search Academic Torrents (RSS Dump)

on:
  workflow_dispatch:
    inputs:
      query:
        description: '🔍 Search term (matches in title)'
        required: true
        type: string
      limit:
        description: '📊 Max results to show'
        required: false
        type: number
        default: 20
      match_name_only:
        description: '📛 Match only torrent name (otherwise also description)'
        required: false
        type: boolean
        default: true

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Download Academic Torrents RSS dump
        run: |
          set -euxo pipefail
          # This is the known URL for the full database dump in XML/RSS format.
          # If it changes, find the new URL at: https://academictorrents.com/docs/api.html
          DB_URL="https://academictorrents.com/database.xml"
          echo "🌐 Downloading database dump (this may be 5-15 MB) ..."
          curl -sS --max-time 60 -o database.xml "$DB_URL"
          FILE_SIZE=$(stat -c%s database.xml 2>/dev/null || echo 0)
          echo "📦 Downloaded $(($FILE_SIZE / 1048576)) MB"
          head -c 200 database.xml
          echo ""

      - name: 🔎 Search & build magnet links
        run: |
          python3 << 'PYEOF'
          import sys, os, xml.etree.ElementTree as ET

          query = os.environ['QUERY'].lower()
          limit = int(os.environ['LIMIT'])
          name_only = os.environ['MATCH_NAME_ONLY'] == 'true'

          try:
              tree = ET.parse("database.xml")
              root = tree.getroot()
          except Exception as e:
              print(f"❌ Failed to parse XML: {e}")
              sys.exit(1)

          # The RSS structure is <rss><channel><item>...
          items = root.findall(".//item")
          print(f"📊 Total torrents in dump: {len(items)}")

          results = []
          for item in items:
              title_el = item.find("title")
              desc_el = item.find("description")
              hash_el = item.find("infohash")  # or possibly <info_hash>, adjust if needed
              if title_el is None or hash_el is None:
                  continue
              title = title_el.text or ""
              description = desc_el.text if desc_el is not None else ""
              infohash = hash_el.text.strip() if hash_el.text else ""

              # Search logic
              text = title if name_only else f"{title} {description}"
              if query in text.lower():
                  magnet = f"magnet:?xt=urn:btih:{infohash}"
                  results.append((title, magnet))

              if len(results) >= limit:
                  break

          if not results:
              print("⚠️ No matching torrents found.")
              sys.exit(0)

          print(f"✅ Found {len(results)} matches (limit {limit})\n")
          with open("results.txt", "w", encoding="utf-8") as f:
              for title, magnet in results:
                  line = f"📌 {title}\n   🔗 {magnet}\n---"
                  print(line)
                  f.write(line + "\n")
          print("\n📄 results.txt saved")
          PYEOF
        env:
          QUERY: ${{ github.event.inputs.query }}
          LIMIT: ${{ github.event.inputs.limit }}
          MATCH_NAME_ONLY: ${{ github.event.inputs.match_name_only }}

      - name: 📤 Upload results & raw dump (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: torrent-search-results
          path: |
            results.txt
            database.xml
          retention-days: 7
