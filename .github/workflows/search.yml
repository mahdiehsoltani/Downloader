name: 🔎 Search Academic Torrents (Fixed)

on:
  workflow_dispatch:
    inputs:
      query:
        description: '🔍 Search term'
        required: true
        type: string
      limit:
        description: '📊 Number of results'
        required: false
        type: number
        default: 10
      sort_by:
        description: '📈 Sort by'
        required: false
        type: choice
        options:
          - seeders
          - relevance
          - size
          - date_added
        default: 'seeders'
      include_internet_archive:
        description: '📚 Also search Internet Archive?'
        required: false
        type: boolean
        default: false

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: 🛠️ Install jq (already present)
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: 🔎 Search Academic Torrents
        id: search_academic
        run: |
          set -euxo pipefail
          echo "🌐 Query: '${{ github.event.inputs.query }}'"
          RESPONSE=$(curl -sS --max-time 15 \
            "https://academictorrents.com/apiv2/entries?search=${{ github.event.inputs.query }}&limit=${{ github.event.inputs.limit }}&sort=${{ github.event.inputs.sort_by }}&order=desc" \
            -H "User-Agent: Mozilla/5.0")
          echo "$RESPONSE" > raw_response_academic.json
          echo "📄 Raw response saved (length: $(wc -c < raw_response_academic.json))"
          head -c 500 raw_response_academic.json
          echo ""

          # Normalise: try array, then object with .torrents
          jq -r '
            if type == "array" then .[]
            else .torrents[]? end
            | select(.name != null)
            | "📌 \(.name)\n   🔗 Magnet: \(.magnet // "N/A")\n   📦 Size: \(.size // "?")\n   🌱 Seeders: \(.seeders // 0)\n---"
          ' raw_response_academic.json > results_academic.txt

          if [[ ! -s results_academic.txt ]]; then
            echo "⚠️ No Academic Torrents results found."
            echo "" > results_academic.txt
          else
            echo "✅ Found results:"
            cat results_academic.txt
          fi

      - name: 📦 Internet Archive search (optional)
        if: ${{ github.event.inputs.include_internet_archive == 'true' }}
        run: |
          set -euxo pipefail
          echo "📚 Searching Internet Archive (most seeded items first)..."
          # Archive advanced search API – returns JSON with .response.docs
          QUERY=$(python3 -c "import urllib.parse; print(urllib.parse.quote('${{ github.event.inputs.query }}'))")
          IA_RESPONSE=$(curl -sS --max-time 20 \
            "https://archive.org/advancedsearch.php?q=${QUERY}+AND+collection%3Aopensource&fl%5B%5D=identifier,title,downloads,date&sort%5B%5D=downloads+desc&rows=${{ github.event.inputs.limit }}&output=json")
          echo "$IA_RESPONSE" > raw_response_archive.json
          echo "📄 Archive raw response (length: $(wc -c < raw_response_archive.json))"
          head -c 500 raw_response_archive.json

          # Parse and create magnet-like torrent URLs
          jq -r '
            .response.docs[]? | 
            "📌 " + .title + "\n   🧲 Torrent: https://archive.org/download/\(.identifier)/\(.identifier)_archive.torrent\n   📦 Identifier: \(.identifier)\n   🌱 Downloads (popularity): \(.downloads)\n---"
          ' raw_response_archive.json > results_archive.txt

          if [[ ! -s results_archive.txt ]]; then
            echo "⚠️ No Internet Archive results."
            echo "" > results_archive.txt
          else
            cat results_archive.txt
          fi

      - name: 🧾 Combine results
        run: |
          echo "===== Academic Torrents =====" > combined_results.txt
          cat results_academic.txt >> combined_results.txt || echo "(none)" >> combined_results.txt
          echo "" >> combined_results.txt
          if [[ -f results_archive.txt ]]; then
            echo "===== Internet Archive =====" >> combined_results.txt
            cat results_archive.txt >> combined_results.txt || echo "(none)" >> combined_results.txt
          fi
          cat combined_results.txt

      - name: 📤 Upload debug & results (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-debug-and-results
          path: |
            raw_response_academic.json
            raw_response_archive.json
            results_academic.txt
            results_archive.txt
            combined_results.txt
          retention-days: 7

      - name: 📤 Upload final readable results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: torrent-search-results
          path: combined_results.txt
          retention-days: 7
