name: 🔎 Torrent Search (Academic / BT4G / Nyaa) – Robust

on:
  workflow_dispatch:
    inputs:
      source:
        description: '🌐 Torrent source'
        required: true
        type: choice
        options:
          - Academic Torrents (RSS dump, no live seeders)
          - BT4G (general, with seeders)
          - Nyaa (anime, with seeders)
        default: 'Academic Torrents (RSS dump, no live seeders)'
      query:
        description: '🔍 Search term'
        required: true
        type: string
      limit:
        description: '📊 Max results'
        required: false
        type: number
        default: 20
      min_seeders:
        description: '🌱 Min seeders (BT4G / Nyaa only)'
        required: false
        type: number
        default: 0

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 🛠️ Install tools
        run: |
          set -x
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl jq zip python3

      - name: 🔍 Download source & run search
        run: |
          set -x
          mkdir -p results
          SOURCE="${{ github.event.inputs.source }}"
          ENCODED_QUERY=$(python3 -c "import urllib.parse; print(urllib.parse.quote('${{ github.event.inputs.query }}'))")

          # Download only what’s needed – do NOT fail on curl errors
          case "$SOURCE" in
            "Academic Torrents (RSS dump, no live seeders)")
              curl -L --max-time 60 -o database.xml "https://academictorrents.com/database.xml" || echo "WARNING: academic dump download failed"
              ;;
            "BT4G (general, with seeders)")
              curl -L -v "https://bt4g.org/rss?q=${ENCODED_QUERY}&sort=seeders&order=desc" \
                -H "User-Agent: Mozilla/5.0" -o results/bt4g.xml || echo "WARNING: BT4G download failed"
              ;;
            "Nyaa (anime, with seeders)")
              curl -L -v "https://nyaa.si/?page=rss&q=${ENCODED_QUERY}&c=1_0&f=0" \
                -H "User-Agent: Mozilla/5.0" -o results/nyaa.xml || echo "WARNING: Nyaa download failed"
              ;;
          esac

          # Base64 Python script – full, with error guards
          echo " | base64 -d > /tmp/search.py
          python3 /tmp/search.py

          # Ensure final.txt always exists
          touch results/academic.txt results/bt4g.txt results/nyaa.txt
          cat results/academic.txt results/bt4g.txt results/nyaa.txt > results/final.txt
          echo "📄 Final results:"
          cat results/final.txt
        env:
          QUERY: ${{ github.event.inputs.query }}
          LIMIT: ${{ github.event.inputs.limit }}
          MIN_SEED: ${{ github.event.inputs.min_seeders }}
          SOURCE: ${{ github.event.inputs.source }}

      - name: 🚀 Push to orphan 'torrents' branch
        if: always()
        run: |
          set -x
          BRANCH="torrents"
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          ORPHAN_DIR=$(mktemp -d)
          cp results/final.txt "$ORPHAN_DIR/"
          cd "$ORPHAN_DIR"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin "$REPO_URL"
          git add .
          if git commit -m "chore: torrent search results [skip ci]"; then
            echo "✅ Commit created"
          else
            echo "ℹ️ Nothing to commit"
            exit 0
          fi
          for attempt in 1 2 3; do
            echo "🚀 Push attempt $attempt..."
            if git push origin "HEAD:$BRANCH" --force; then
              echo "✅ Push succeeded"
              exit 0
            fi
            sleep 15
          done
          echo "❌ Push failed after 3 attempts"
          exit 1

      - name: 📤 Upload artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-results-${{ github.run_id }}
          path: |
            results/
            database.xml
          retention-days: 7
