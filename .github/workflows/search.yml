name: 🔎 Torrent Search (Academic / BT4G / Nyaa)

on:
  workflow_dispatch:
    inputs:
      source:
        description: '🌐 Torrent source'
        required: true
        type: choice
        options:
          - Academic Torrents (RSS dump, no live seeders)
          - BT4G (general, with seeders)
          - Nyaa (anime, with seeders)
        default: 'Academic Torrents (RSS dump, no live seeders)'
      query:
        description: '🔍 Search term'
        required: true
        type: string
      limit:
        description: '📊 Max results'
        required: false
        type: number
        default: 20
      min_seeders:
        description: '🌱 Min seeders (only for BT4G / Nyaa)'
        required: false
        type: number
        default: 0

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 🛠️ Install tools
        run: sudo apt-get update && sudo apt-get install -y curl jq zip

      - name: 🔍 Determine source & run search
        run: |
          SOURCE="${{ github.event.inputs.source }}"
          QUERY="${{ github.event.inputs.query }}"
          LIMIT="${{ github.event.inputs.limit }}"
          MIN_SEED="${{ github.event.inputs.min_seeders }}"

          mkdir -p results
          echo "" > results/final.txt

          case "$SOURCE" in
            "Academic Torrents (RSS dump, no live seeders)")
              echo "📚 Searching Academic Torrents (RSS dump)..."
              curl -sS --max-time 60 -o database.xml \
                "https://academictorrents.com/database.xml"
              python3 << 'PYEOF'
              import xml.etree.ElementTree as ET, os
              query = os.environ['QUERY'].lower()
              limit = int(os.environ['LIMIT'])
              tree = ET.parse("database.xml")
              items = tree.findall(".//item")
              count = 0
              out_lines = []
              for i in items:
                  t = (i.findtext("title") or "").lower()
                  if query in t:
                      ih = i.findtext("infohash") or ""
                      title = i.findtext("title") or ""
                      sz = i.findtext("size") or "0"
                      magnet = f"magnet:?xt=urn:btih:{ih}"
                      out_lines.append(f"📌 {title}\n   🔗 {magnet}\n   📦 Size: {sz} bytes\n   🌱 Seeders: (unavailable)\n---")
                      count += 1
                      if count >= limit: break
              if out_lines:
                  with open("results/academic.txt", "w") as f:
                      f.write("\n".join(out_lines))
                  print(f"✅ {len(out_lines)} results")
              else:
                  print("⚠️ No matches found")
              PYEOF
              cat results/academic.txt >> results/final.txt
              ;;

            "BT4G (general, with seeders)")
              echo "🔎 Searching BT4G..."
              curl -sS "https://bt4g.org/rss?q=${QUERY}&sort=seeders&order=desc" \
                -H "User-Agent: Mozilla/5.0" \
                -o results/bt4g.xml
              python3 << 'PYEOF'
              import xml.etree.ElementTree as ET, os
              query = os.environ['QUERY'].lower()
              limit = int(os.environ['LIMIT'])
              min_seed = int(os.environ['MIN_SEED'])
              tree = ET.parse("results/bt4g.xml")
              items = tree.findall(".//item")
              count = 0
              out = []
              for i in items:
                  title = i.findtext("title") or ""
                  magnet = i.findtext("link") or ""  # BT4G RSS uses <link> for magnet
                  seed_el = i.find("numSeeders") or i.find("seeders")
                  seeders = int(seed_el.text) if seed_el is not None else 0
                  size = i.findtext("size") or "0"
                  if seeders < min_seed:
                      continue
                  if query in title.lower():
                      out.append(f"📌 {title}\n   🔗 {magnet}\n   📦 Size: {size}\n   🌱 Seeders: {seeders}\n---")
                      count += 1
                      if count >= limit: break
              if out:
                  with open("results/bt4g.txt", "w") as f:
                      f.write("\n".join(out))
                  print(f"✅ {len(out)} results")
              else:
                  print("⚠️ No matches (or seeders below threshold)")
              PYEOF
              cat results/bt4g.txt >> results/final.txt
              ;;

            "Nyaa (anime, with seeders)")
              echo "🗾 Searching Nyaa..."
              curl -sS "https://nyaa.si/?page=rss&q=${QUERY}&c=1_0&f=0" \
                -H "User-Agent: Mozilla/5.0" \
                -o results/nyaa.xml
              python3 << 'PYEOF'
              import xml.etree.ElementTree as ET, os
              query = os.environ['QUERY'].lower()
              limit = int(os.environ['LIMIT'])
              min_seed = int(os.environ['MIN_SEED'])
              tree = ET.parse("results/nyaa.xml")
              ns = {'nyaa': 'https://nyaa.si/xmlns/nyaa'}
              items = tree.findall(".//item")
              count = 0
              out = []
              for i in items:
                  title = i.findtext("title") or ""
                  magnet = i.findtext("link") or ""  # <link> is the torrent page, but magnet is often in <guid>; we'll extract from <link>
                  # Actually Nyaa RSS puts the magnet in <link>? No, <link> is the HTML page. Magnet is sometimes in <guid>
                  # We'll use the infohash and construct magnet ourselves
                  ih = i.findtext("guid") or ""
                  # Strip prefix if present
                  if "/view/" in ih:
                      ih = ih.split("/view/")[-1]
                  magnet = f"magnet:?xt=urn:btih:{ih}"
                  seed_el = i.find("nyaa:seeders", ns)
                  seeders = int(seed_el.text) if seed_el is not None else 0
                  size = i.findtext("nyaa:size") or "0"
                  if seeders < min_seed:
                      continue
                  if query in title.lower():
                      out.append(f"📌 {title}\n   🔗 {magnet}\n   📦 Size: {size}\n   🌱 Seeders: {seeders}\n---")
                      count += 1
                      if count >= limit: break
              if out:
                  with open("results/nyaa.txt", "w") as f:
                      f.write("\n".join(out))
                  print(f"✅ {len(out)} results")
              else:
                  print("⚠️ No matches (or seeders below threshold)")
              PYEOF
              cat results/nyaa.txt >> results/final.txt
              ;;
          esac

          if [ ! -s results/final.txt ]; then
            echo "⚠️ No results found for any source." > results/final.txt
          fi
        env:
          QUERY: ${{ github.event.inputs.query }}
          LIMIT: ${{ github.event.inputs.limit }}
          MIN_SEED: ${{ github.event.inputs.min_seeders }}

      - name: 🚀 Push results to orphan 'torrents' branch
        run: |
          BRANCH="torrents"
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          ORPHAN_DIR=$(mktemp -d)
          cp results/final.txt "$ORPHAN_DIR/"
          cd "$ORPHAN_DIR"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin "$REPO_URL"
          git add .
          git commit -m "chore: torrent search results [skip ci]" || { echo "ℹ️ Nothing to commit"; exit 0; }
          for attempt in 1 2 3; do
            echo "🚀 Push attempt $attempt..."
            if git push origin "HEAD:$BRANCH" --force; then echo "✅ Pushed"; exit 0; fi
            sleep 15
          done
          echo "❌ Push failed"
          exit 1

      - name: 📤 Upload artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-results-${{ github.run_id }}
          path: results/final.txt
          retention-days: 7
