name: 🔎 Torrent Search (Academic / BT4G / Nyaa)

on:
  workflow_dispatch:
    inputs:
      source:
        description: '🌐 Torrent source'
        required: true
        type: choice
        options:
          - Academic Torrents (RSS dump, no live seeders)
          - BT4G (general, with seeders)
          - Nyaa (anime, with seeders)
        default: 'Academic Torrents (RSS dump, no live seeders)'
      query:
        description: '🔍 Search term'
        required: true
        type: string
      limit:
        description: '📊 Max results'
        required: false
        type: number
        default: 20
      min_seeders:
        description: '🌱 Min seeders (BT4G / Nyaa only)'
        required: false
        type: number
        default: 0

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 🛠️ Install tools
        run: |
          set -x
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl jq zip python3

      - name: 🔍 Run search
        run: |
          set -x
          mkdir -p results

          # Write the search script to a file using a literal YAML block
          cat > /tmp/search_torrent.py << 'PYEOF'
import xml.etree.ElementTree as ET
import os, sys, urllib.parse

source = os.environ['SOURCE']
query = os.environ['QUERY'].lower()
limit = int(os.environ['LIMIT'])
min_seed = int(os.environ['MIN_SEED'])

def build_magnet(infohash):
    return f"magnet:?xt=urn:btih:{infohash}"

def search_academic():
    import subprocess
    # download the dump if not present (it won't be because the file is in the workspace)
    # We'll assume database.xml is already downloaded (we'll do that in the step)
    tree = ET.parse("database.xml")
    items = tree.findall(".//item")
    out = []
    for i in items:
        title = (i.findtext("title") or "").lower()
        if query in title:
            ih = i.findtext("infohash") or ""
            magnet = build_magnet(ih)
            size = i.findtext("size") or "0"
            out.append(f"📌 {i.findtext('title')}\n   🔗 {magnet}\n   📦 Size: {size} bytes\n   🌱 Seeders: (unavailable)\n---")
            if len(out) >= limit:
                break
    return out

def search_bt4g():
    # download happens in shell, file is results/bt4g.xml
    tree = ET.parse("results/bt4g.xml")
    items = tree.findall(".//item")
    out = []
    for i in items:
        title = (i.findtext("title") or "").lower()
        if query in title:
            magnet = i.findtext("link") or ""
            seed_el = i.find("numSeeders") or i.find("seeders") or i.find("seeds")
            seeders = int(seed_el.text) if seed_el is not None else 0
            if seeders < min_seed:
                continue
            size = i.findtext("size") or "0"
            out.append(f"📌 {i.findtext('title')}\n   🔗 {magnet}\n   📦 Size: {size}\n   🌱 Seeders: {seeders}\n---")
            if len(out) >= limit:
                break
    return out

def search_nyaa():
    tree = ET.parse("results/nyaa.xml")
    ns = {'nyaa': 'https://nyaa.si/xmlns/nyaa'}
    items = tree.findall(".//item")
    out = []
    for i in items:
        title = (i.findtext("title") or "").lower()
        if query in title:
            guid = i.findtext("guid") or ""
            if "/view/" in guid:
                info_hash = guid.rsplit("/view/", 1)[-1]
            else:
                info_hash = guid
            magnet = build_magnet(info_hash)
            seed_el = i.find("nyaa:seeders", ns)
            seeders = int(seed_el.text) if seed_el is not None else 0
            if seeders < min_seed:
                continue
            size_el = i.find("nyaa:size", ns)
            size = size_el.text if size_el is not None else i.findtext("size") or "0"
            out.append(f"📌 {i.findtext('title')}\n   🔗 {magnet}\n   📦 Size: {size}\n   🌱 Seeders: {seeders}\n---")
            if len(out) >= limit:
                break
    return out

if source == "Academic Torrents (RSS dump, no live seeders)":
    results = search_academic()
    filename = "results/academic.txt"
elif source == "BT4G (general, with seeders)":
    results = search_bt4g()
    filename = "results/bt4g.txt"
elif source == "Nyaa (anime, with seeders)":
    results = search_nyaa()
    filename = "results/nyaa.txt"
else:
    results = []
    filename = "results/unknown.txt"

if results:
    with open(filename, "w") as f:
        f.write("\n".join(results))
    print(f"✅ {len(results)} results written to {filename}")
else:
    with open(filename, "w") as f:
        f.write("(no results)")
    print(f"⚠️ No results for {source}")
PYEOF

          # Download the necessary files and run the script
          SOURCE="${{ github.event.inputs.source }}"
          ENCODED_QUERY=$(python3 -c "import urllib.parse; print(urllib.parse.quote('${{ github.event.inputs.query }}'))")

          case "$SOURCE" in
            "Academic Torrents (RSS dump, no live seeders)")
              curl -L -v --max-time 60 -o database.xml "https://academictorrents.com/database.xml"
              ;;
            "BT4G (general, with seeders)")
              curl -L -v "https://bt4g.org/rss?q=${ENCODED_QUERY}&sort=seeders&order=desc" \
                -H "User-Agent: Mozilla/5.0" -o results/bt4g.xml
              ;;
            "Nyaa (anime, with seeders)")
              curl -L -v "https://nyaa.si/?page=rss&q=${ENCODED_QUERY}&c=1_0&f=0" \
                -H "User-Agent: Mozilla/5.0" -o results/nyaa.xml
              ;;
          esac

          python3 /tmp/search_torrent.py

          # Build final.txt
          cat results/academic.txt results/bt4g.txt results/nyaa.txt 2>/dev/null > results/final.txt
          echo "📄 Final results:"
          cat results/final.txt
        env:
          QUERY: ${{ github.event.inputs.query }}
          LIMIT: ${{ github.event.inputs.limit }}
          MIN_SEED: ${{ github.event.inputs.min_seeders }}
          SOURCE: ${{ github.event.inputs.source }}

      - name: 🚀 Push to orphan 'torrents' branch
        if: always()
        run: |
          set -x
          BRANCH="torrents"
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          ORPHAN_DIR=$(mktemp -d)
          cp results/final.txt "$ORPHAN_DIR/"
          cd "$ORPHAN_DIR"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin "$REPO_URL"
          git add .
          if git commit -m "chore: torrent search results [skip ci]"; then
            echo "✅ Commit created"
          else
            echo "ℹ️ Nothing to commit"
            exit 0
          fi
          for attempt in 1 2 3; do
            echo "🚀 Push attempt $attempt..."
            if git push origin "HEAD:$BRANCH" --force; then
              echo "✅ Push succeeded"
              exit 0
            fi
            sleep 15
          done
          echo "❌ Push failed after 3 attempts"
          exit 1

      - name: 📤 Upload artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-results-${{ github.run_id }}
          path: |
            results/
            database.xml
          retention-days: 7
