name: 🧪 Test Torrent RSS Feeds

on:
  workflow_dispatch:   # manual trigger only

jobs:
  test-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 📡 Probe each feed & collect status
        run: |
          set -euo pipefail
          mkdir -p feed_tests

          # ──────────────────────────────────────────────
          # 📋 List of RSS/XML feed URLs to test
          #    Add / remove / modify as needed
          # ──────────────────────────────────────────────
          URLS=(
            "https://academictorrents.com/database.xml"
            "https://nyaa.si/?page=rss&q=test&c=0_0&f=0"
            "https://1337x.to/cat/Movies/1/rss.xml"
            "https://www.magnetdl.com/rss.xml?q=test"
            "https://www.torlock.com/movies/rss.xml"
            "https://eztvx.to/ezrss.xml"
            # Add more candidate URLs below
            # "https://example.com/somefeed.xml"
          )

          SUMMARY="feed_tests/summary.txt"
          DETAIL_DIR="feed_tests/details"
          mkdir -p "$DETAIL_DIR"

          echo "Testing ${#URLS[@]} feeds..." | tee "$SUMMARY"
          echo "" | tee -a "$SUMMARY"

          for url in "${URLS[@]}"; do
            # Safe filename for the detail file
            safe_name=$(echo "$url" | tr -c 'a-zA-Z0-9._-' '_' | cut -c1-80)
            detail_file="$DETAIL_DIR/${safe_name}.txt"

            # 1. Get HTTP status code
            http_code=$(curl -s -o /dev/null -w "%{http_code}" \
                        -L --max-time 15 \
                        -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36" \
                        "$url" 2>/dev/null || echo "000")

            # 2. If 2xx, download the first 500 bytes of the body
            if [[ "$http_code" =~ ^2[0-9][0-9]$ ]]; then
              curl -s --max-time 10 -L \
                   -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36" \
                   "$url" | head -c 500 > "$detail_file"
              content_size=$(wc -c < "$detail_file")
              echo "✅ $url -> HTTP $http_code (saved $content_size bytes)" | tee -a "$SUMMARY"
            else
              echo "❌ $url -> HTTP $http_code" | tee -a "$SUMMARY"
              # Still save a snippet if any content was returned (e.g., error page)
              curl -s --max-time 10 -L "$url" | head -c 200 > "$detail_file" 2>/dev/null || true
            fi
          done

          echo "" | tee -a "$SUMMARY"
          echo "Detailed first‑bytes dumps are in feed_tests/details/" | tee -a "$SUMMARY"

      - name: 📤 Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feed-test-results
          path: feed_tests/
          retention-days: 7
