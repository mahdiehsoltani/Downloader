<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube HLS Player</title>
<script src="https://lib.arvancloud.ir/hls.js/1.3.3/hls.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://lib.arvancloud.ir/mux.js/6.3.0/mux.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0a0a; display:flex; justify-content:center; align-items:center; min-height:100vh; font-family:system-ui, -apple-system, sans-serif; }
  .player-container { width:100%; max-width:960px; position:relative; background:#000; border-radius:8px; overflow:hidden; box-shadow:0 8px 32px rgba(0,0,0,0.5); }
  video { width:100%; display:block; background:#000; }
  .controls { position:absolute; bottom:0; left:0; right:0; background:linear-gradient(transparent, rgba(0,0,0,0.8)); padding:40px 16px 16px; transition:opacity 0.3s; }
  .controls.hidden { opacity:0; pointer-events:none; }
  .progress-bar { width:100%; height:4px; background:rgba(255,255,255,0.2); border-radius:2px; cursor:pointer; margin-bottom:12px; }
  .progress-fill { height:100%; background:#ff3b30; border-radius:2px; width:0%; transition:width 0.1s linear; }
  .row { display:flex; align-items:center; gap:12px; color:#fff; }
  button { background:transparent; border:none; color:#fff; cursor:pointer; font-size:20px; padding:4px 8px; border-radius:4px; transition:background 0.2s; }
  button:hover { background:rgba(255,255,255,0.1); }
  .time { font-size:13px; }
  .volume-slider { width:80px; }
  .speed-select { background:rgba(255,255,255,0.1); border:none; color:#fff; padding:2px 6px; border-radius:4px; }
  .download-btn { background:#ff3b30; color:#fff; font-size:14px; padding:6px 12px; border-radius:4px; cursor:pointer; }
  .download-btn:disabled { opacity:0.5; cursor:not-allowed; }
  .overlay { position:absolute; top:0; left:0; width:100%; height:100%; display:flex; justify-content:center; align-items:center; background:rgba(0,0,0,0.4); cursor:pointer; z-index:2; }
  .overlay-btn { font-size:48px; color:#fff; }
  .download-progress { width:100%; height:4px; background:rgba(255,255,255,0.2); border-radius:2px; margin-top:8px; display:none; }
  .download-fill { height:100%; background:#ff3b30; width:0%; }
</style>
</head>
<body>
<div class="player-container">
  <video id="video" crossorigin="anonymous"></video>
  <div class="overlay" id="playOverlay" onclick="playVideo()">
    <div class="overlay-btn">▶</div>
  </div>
  <div class="controls hidden" id="controls">
    <div class="progress-bar" id="progressBar" onmousedown="seek(event)">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="row">
      <button onclick="togglePlay()" id="playBtn">▶</button>
      <span class="time" id="timeDisplay">0:00 / 0:00</span>
      <button onclick="muteToggle()">🔊</button>
      <input type="range" class="volume-slider" min="0" max="100" value="100" oninput="setVolume(this.value)">
      <select class="speed-select" onchange="setSpeed(this.value)">
        <option value="0.5">0.5x</option>
        <option value="0.75">0.75x</option>
        <option value="1" selected>1x</option>
        <option value="1.25">1.25x</option>
        <option value="1.5">1.5x</option>
        <option value="2">2x</option>
      </select>
      <button onclick="toggleFullscreen()">⛶</button>
      <button class="download-btn" onclick="downloadVideo()">⬇ Download MP4</button>
    </div>
    <div class="download-progress" id="downloadProgress">
      <div class="download-fill" id="downloadFill"></div>
    </div>
  </div>
</div>

<script>
const video = document.getElementById('video');
const playOverlay = document.getElementById('playOverlay');
const controls = document.getElementById('controls');
const playBtn = document.getElementById('playBtn');
const progressBar = document.getElementById('progressBar');
const progressFill = document.getElementById('progressFill');
const timeDisplay = document.getElementById('timeDisplay');
const downloadProgress = document.getElementById('downloadProgress');
const downloadFill = document.getElementById('downloadFill');

let hls;
const PLAYLIST_URL = 'https://raw.githubusercontent.com/mahdiehsoltani/Downloader/refs/heads/youtube-stream/playlist.m3u8';

function initPlayer() {
  if (typeof Hls !== 'undefined' && Hls.isSupported()) {
    hls = new Hls({ debug: false });
    hls.loadSource(PLAYLIST_URL);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      console.log('HLS manifest loaded');
    });
    hls.on(Hls.Events.ERROR, (event, data) => {
      if (data.fatal) {
        console.error('HLS fatal error', data);
        alert('Playback error. Please try again later.');
      }
    });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = PLAYLIST_URL;
  } else {
    alert('Your browser does not support HLS playback.');
  }
}

function playVideo() {
  video.play().catch(() => {});
  playOverlay.style.display = 'none';
  controls.classList.remove('hidden');
}

function togglePlay() {
  if (video.paused) { video.play().catch(()=>{}); playBtn.textContent = '⏸'; }
  else { video.pause(); playBtn.textContent = '▶'; }
}

video.addEventListener('click', togglePlay);

video.addEventListener('timeupdate', () => {
  const pct = (video.currentTime / video.duration) * 100;
  progressFill.style.width = pct + '%';
  timeDisplay.textContent = formatTime(video.currentTime) + ' / ' + formatTime(video.duration);
  playBtn.textContent = video.paused ? '▶' : '⏸';
});

function seek(e) {
  const rect = progressBar.getBoundingClientRect();
  const ratio = (e.clientX - rect.left) / rect.width;
  video.currentTime = ratio * video.duration;
}

function setVolume(val) { video.volume = val / 100; }
function muteToggle() { video.muted = !video.muted; }
function setSpeed(speed) { video.playbackRate = parseFloat(speed); }
function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen();
  else video.parentElement.requestFullscreen();
}
function formatTime(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}

async function downloadVideo() {
  downloadProgress.style.display = 'block';
  downloadFill.style.width = '0%';
  try {
    console.log('Fetching master/m3u8: ' + PLAYLIST_URL);
    const response = await fetch(PLAYLIST_URL);
    let text = await response.text();

    let mediaPlaylistUrl = PLAYLIST_URL;
    if (text.includes('#EXT-X-STREAM-INF')) {
      console.log('Master playlist detected, extracting first variant');
      const lines = text.split(/\r?\n/);
      let firstVariant = null;
      for (let i = 0; i < lines.length; i++) {
        if (lines[i].startsWith('#EXT-X-STREAM-INF')) {
          const variantUrl = lines[i+1] ? lines[i+1].trim() : null;
          if (variantUrl && !variantUrl.startsWith('#')) {
            firstVariant = variantUrl;
            break;
          }
        }
      }
      if (!firstVariant) throw new Error('No variant stream found in master playlist');
      console.log('First variant URL: ' + firstVariant);
      if (firstVariant.startsWith('http')) {
        mediaPlaylistUrl = firstVariant;
      } else {
        const base = PLAYLIST_URL.substring(0, PLAYLIST_URL.lastIndexOf('/') + 1);
        mediaPlaylistUrl = base + firstVariant;
      }
      console.log('Resolved media playlist URL: ' + mediaPlaylistUrl);
      const mediaResp = await fetch(mediaPlaylistUrl);
      text = await mediaResp.text();
    }

    console.log('Parsing segment list');
    const segmentUrls = text.split(/\r?\n/)
      .map(l => l.trim())
      .filter(l => l.endsWith('.ts'));
    console.log('Found ' + segmentUrls.length + ' segments');
    if (!segmentUrls.length) throw new Error('No segments found');

    const baseUrl = mediaPlaylistUrl.substring(0, mediaPlaylistUrl.lastIndexOf('/') + 1);
    const fullSegmentUrls = segmentUrls.map(seg => {
      if (seg.startsWith('http')) return seg;
      return baseUrl + seg;
    });

    let initSegmentPushed = false;
    const transmuxer = new muxjs.mp4.Transmuxer();
    const chunks = [];

    transmuxer.on('data', (segment) => {
      if (segment.type === 'video' || segment.type === 'audio') {
        chunks.push(segment.data);
      } else if (segment.type === 'combined') {
        if (!initSegmentPushed && segment.initSegment) {
          chunks.push(segment.initSegment);
          initSegmentPushed = true;
        }
        chunks.push(segment.data);
      }
    });

    // Download and process all segments sequentially
    for (let i = 0; i < fullSegmentUrls.length; i++) {
      console.log('Downloading segment ' + (i+1) + '/' + fullSegmentUrls.length);
      const resp = await fetch(fullSegmentUrls[i]);
      const buffer = await resp.arrayBuffer();
      transmuxer.push(new Uint8Array(buffer));
      transmuxer.flush();
      downloadFill.style.width = ((i + 1) / fullSegmentUrls.length * 100) + '%';
    }

    transmuxer.endTimeline();

    console.log('Transmuxing complete');
    const blob = new Blob(chunks, { type: 'video/mp4' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'video.mp4';
    a.click();
    URL.revokeObjectURL(a.href);
    downloadProgress.style.display = 'none';
  } catch (err) {
    console.error('Download failed', err);
    alert('Download failed: ' + err.message);
    downloadProgress.style.display = 'none';
  }
}

if (typeof Hls !== 'undefined') { initPlayer(); }
else { alert('Hls.js failed to load'); }
</script>
</body>
</html>
